<p>我說我想知道中國人的精神是什麼，蒙古人的精神又是什麼。大哥說中國人和台灣人一樣，都是沒有覺悟，吃飽了就開始想著掙錢，有了錢以後，他還想壓迫你。</p>
 <figure>
        <img src="../../assets/cn/2026-04-30-01.jpeg" alt="清晨休息站">
  </figure>
<p>跟幾位大哥說：「我幫你們照張相吧？」三個人馬上姿態都擺正了。拍完後後覺得不對啊，大哥你老婆還在煮飯呢，坐著聊得那麼開心是可以的嗎。於是退後幾步，讓大姐也入鏡。</p>
<p>這兩天伙食真的太好，</p>
